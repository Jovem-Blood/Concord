<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concord UI audit</title></head><body><div id="app"></div>
<script type="module">
if (!import.meta.env.DEV) throw new Error('Development-only synthetic capture')
const params = new URLSearchParams(location.search)
const deny = params.has('deny')
navigator.mediaDevices.getUserMedia = async () => {
  if (deny) throw new DOMException('Synthetic permission denial', 'NotAllowedError')
  const context = new AudioContext(); await context.resume()
  const oscillator = context.createOscillator(); const gain = context.createGain(); gain.gain.value = 0.01
  const destination = context.createMediaStreamDestination(); oscillator.connect(gain).connect(destination); oscillator.start()
  const track = destination.stream.getAudioTracks()[0]; const stop = track.stop.bind(track)
  track.stop = () => { stop(); oscillator.stop(); void context.close() }
  return destination.stream
}
navigator.mediaDevices.getDisplayMedia = async (options) => {
  const canvas = document.createElement('canvas'); canvas.width = options.video.width.max; canvas.height = options.video.height.max
  const painter = canvas.getContext('2d'); let frame = 0
  const paint = () => { frame++; painter.fillStyle=`hsl(${frame%360} 60% 30%)`; painter.fillRect(0,0,canvas.width,canvas.height); painter.fillStyle='white'; painter.font='60px sans-serif'; painter.fillText(`Concord audit ${canvas.width}×${canvas.height} — ${frame}`,40,140) }
  paint(); const timer = setInterval(paint, 33); const stream = canvas.captureStream(30)
  const track = stream.getVideoTracks()[0]; const stop = track.stop.bind(track)
  track.stop = () => { stop(); clearInterval(timer) }
  window.addEventListener('pagehide', () => clearInterval(timer), { once:true })
  return stream
}
await import('./src/renderer/main.ts')
</script></body></html>
