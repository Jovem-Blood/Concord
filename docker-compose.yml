name: infra

services:
  token-server:
    build:
      context: .
      dockerfile: apps/token-server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      CLOUDFLARE_SFU_APP_ID: ${CLOUDFLARE_SFU_APP_ID:?Set CLOUDFLARE_SFU_APP_ID in .env}
      CLOUDFLARE_SFU_APP_SECRET: ${CLOUDFLARE_SFU_APP_SECRET:?Set CLOUDFLARE_SFU_APP_SECRET in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:3001:3001/tcp"

  web:
    build:
      context: .
      dockerfile: apps/desktop/Dockerfile.web
      args:
        VITE_TOKEN_SERVER_URL: ${PUBLIC_TOKEN_SERVER_URL:-http://localhost:3001}
        VITE_WEB_APP_URL: ${PUBLIC_APP_URL:-http://localhost:4173}
    restart: unless-stopped
    depends_on:
      - token-server
    ports:
      - "127.0.0.1:4173:4173/tcp"
