services:
  livekit:
    image: livekit/livekit-server:v1.13.5
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"

  token-server:
    build:
      context: ..
      dockerfile: apps/token-server/Dockerfile
    restart: unless-stopped
    depends_on:
      - livekit
    environment:
      NODE_ENV: production
      PORT: 3001
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    ports:
      - "3001:3001/tcp"

  web:
    build:
      context: ..
      dockerfile: apps/desktop/Dockerfile.web
      args:
        VITE_TOKEN_SERVER_URL: http://localhost:3001
        VITE_WEB_APP_URL: ${PUBLIC_APP_URL:-http://localhost:4173}
    restart: unless-stopped
    depends_on:
      - token-server
    ports:
      - "4173:4173/tcp"
