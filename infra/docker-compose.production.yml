services:
  token-server:
    build:
      context: ..
      dockerfile: apps/token-server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      CLOUDFLARE_SFU_APP_ID: ${CLOUDFLARE_SFU_APP_ID:?Set CLOUDFLARE_SFU_APP_ID in .env}
      CLOUDFLARE_SFU_APP_SECRET: ${CLOUDFLARE_SFU_APP_SECRET:?Set CLOUDFLARE_SFU_APP_SECRET in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      CLOUDFLARE_TURN_API_TOKEN: ${CLOUDFLARE_TURN_API_TOKEN:-}
      CLOUDFLARE_TURN_TTL_SECONDS: ${CLOUDFLARE_TURN_TTL_SECONDS:-7200}
    ports:
      - "127.0.0.1:3001:3001/tcp"

  web:
    build:
      context: ..
      dockerfile: apps/desktop/Dockerfile.web
      args:
        VITE_TOKEN_SERVER_URL: ${PUBLIC_TOKEN_SERVER_URL:-${PUBLIC_APP_URL}}
        VITE_WEB_APP_URL: ${PUBLIC_APP_URL}
    restart: unless-stopped
    depends_on:
      - token-server
    ports:
      - "127.0.0.1:4173:4173/tcp"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - token-server
      - web
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
