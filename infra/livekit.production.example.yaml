port: 7880
logging:
  level: info
rtc:
  tcp_port: 7881
  # A single UDP mux port is easier to forward on a home router than a large range.
  udp_port: 7882
  use_external_ip: true
turn:
  enabled: true
  # Point this DNS-only hostname at the server's public IP; do not proxy it through Cloudflare.
  domain: turn.example.com
  udp_port: 3478
  relay_range_start: 30000
  relay_range_end: 30100
